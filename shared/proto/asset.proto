syntax = "proto3";

package ares.asset;

option go_package = "github.com/ares-x/shared/proto/asset";

import "common.proto";

// AssetType defines the category of an infrastructure asset.
enum AssetType {
  ASSET_TYPE_UNSPECIFIED = 0;
  ASSET_TYPE_SERVER = 1;
  ASSET_TYPE_WORKSTATION = 2;
  ASSET_TYPE_NETWORK_DEVICE = 3;
  ASSET_TYPE_DATABASE = 4;
  ASSET_TYPE_APPLICATION = 5;
  ASSET_TYPE_CLOUD_INSTANCE = 6;
  ASSET_TYPE_CONTAINER = 7;
  ASSET_TYPE_IOT_DEVICE = 8;
  ASSET_TYPE_MOBILE_DEVICE = 9;
  ASSET_TYPE_VIRTUAL_MACHINE = 10;
}

// Criticality indicates the importance level of an asset.
enum Criticality {
  CRITICALITY_UNSPECIFIED = 0;
  CRITICALITY_LOW = 1;
  CRITICALITY_MEDIUM = 2;
  CRITICALITY_HIGH = 3;
  CRITICALITY_CRITICAL = 4;
}

// Asset represents an infrastructure asset in the system.
message Asset {
  ares.common.UUID id = 1;
  string name = 2;
  string hostname = 3;
  string ip_address = 4;
  AssetType type = 5;
  Criticality criticality = 6;
  string owner = 7;
  string department = 8;
  string location = 9;
  string os = 10;
  string os_version = 11;
  map<string, string> tags = 12;
  map<string, string> metadata = 13;
  ares.common.Status status = 14;
  ares.common.Timestamp created_at = 15;
  ares.common.Timestamp updated_at = 16;
  ares.common.Timestamp last_seen = 17;
}

// ListAssetsRequest specifies filters for listing assets.
message ListAssetsRequest {
  repeated AssetType types = 1;
  repeated Criticality criticalities = 2;
  ares.common.Status status = 3;
  string search_query = 4;
  ares.common.PaginationRequest pagination = 5;
  ares.common.SortField sort = 6;
}

// ListAssetsResponse returns a paginated list of assets.
message ListAssetsResponse {
  repeated Asset assets = 1;
  ares.common.Pagination pagination = 2;
}

// GetAssetRequest retrieves a single asset by ID.
message GetAssetRequest {
  ares.common.UUID id = 1;
}

// GetAssetResponse returns the requested asset.
message GetAssetResponse {
  Asset asset = 1;
}

// CreateAssetRequest contains the data for creating a new asset.
message CreateAssetRequest {
  string name = 1;
  string hostname = 2;
  string ip_address = 3;
  AssetType type = 4;
  Criticality criticality = 5;
  string owner = 6;
  string department = 7;
  string location = 8;
  string os = 9;
  string os_version = 10;
  map<string, string> tags = 11;
  map<string, string> metadata = 12;
}

// CreateAssetResponse returns the created asset.
message CreateAssetResponse {
  Asset asset = 1;
}

// UpdateAssetRequest contains updated fields for an asset.
message UpdateAssetRequest {
  ares.common.UUID id = 1;
  optional string name = 2;
  optional string hostname = 3;
  optional string ip_address = 4;
  optional AssetType type = 5;
  optional Criticality criticality = 6;
  optional string owner = 7;
  optional string department = 8;
  optional string location = 9;
  optional string os = 10;
  optional string os_version = 11;
  map<string, string> tags = 12;
  map<string, string> metadata = 13;
}

// UpdateAssetResponse returns the updated asset.
message UpdateAssetResponse {
  Asset asset = 1;
}

// DeleteAssetRequest specifies which asset to delete.
message DeleteAssetRequest {
  ares.common.UUID id = 1;
}

// DeleteAssetResponse confirms deletion.
message DeleteAssetResponse {
  bool success = 1;
}

// SearchAssetsRequest provides full-text search capabilities.
message SearchAssetsRequest {
  string query = 1;
  repeated AssetType types = 2;
  repeated Criticality criticalities = 3;
  ares.common.PaginationRequest pagination = 4;
}

// SearchAssetsResponse returns matching assets.
message SearchAssetsResponse {
  repeated Asset assets = 1;
  ares.common.Pagination pagination = 2;
  int32 total_matches = 3;
}

// AssetService provides CRUD and search operations for assets.
service AssetService {
  // ListAssets returns a filtered, paginated list of assets.
  rpc ListAssets(ListAssetsRequest) returns (ListAssetsResponse);

  // GetAsset retrieves a single asset by ID.
  rpc GetAsset(GetAssetRequest) returns (GetAssetResponse);

  // CreateAsset creates a new asset record.
  rpc CreateAsset(CreateAssetRequest) returns (CreateAssetResponse);

  // UpdateAsset modifies an existing asset.
  rpc UpdateAsset(UpdateAssetRequest) returns (UpdateAssetResponse);

  // DeleteAsset removes an asset from the system.
  rpc DeleteAsset(DeleteAssetRequest) returns (DeleteAssetResponse);

  // SearchAssets performs full-text search across assets.
  rpc SearchAssets(SearchAssetsRequest) returns (SearchAssetsResponse);
}
