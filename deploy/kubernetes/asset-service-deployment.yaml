apiVersion: apps/v1
kind: Deployment
metadata:
  name: asset-service
  namespace: ares-x
  labels:
    app.kubernetes.io/name: asset-service
    app.kubernetes.io/part-of: ares-x
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: asset-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: asset-service
        app.kubernetes.io/part-of: ares-x
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: asset-service
          image: ares-x/asset-service:latest
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ares-x-config
            - secretRef:
                name: ares-x-secrets
          env:
            - name: PORT
              value: "8081"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: asset-service
  namespace: ares-x
  labels:
    app.kubernetes.io/name: asset-service
    app.kubernetes.io/part-of: ares-x
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8081
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: asset-service
