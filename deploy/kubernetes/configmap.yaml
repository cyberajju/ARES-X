apiVersion: v1
kind: ConfigMap
metadata:
  name: ares-x-config
  namespace: ares-x
  labels:
    app.kubernetes.io/name: ares-x
    app.kubernetes.io/component: config
data:
  APP_ENV: "production"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  GRAPH_ENGINE_ADDR: "graph-engine:50051"
  ASSET_SERVICE_ADDR: "asset-service:8081"
  ATTACK_PATH_ENGINE_ADDR: "attack-path-engine:8082"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "ares_x"
  REDIS_ADDR: "redis:6379"
  REDIS_DB: "0"
  CORS_ORIGINS: "https://ares-x.example.com"
  JWT_ISSUER: "ares-x"
  JWT_EXPIRY: "3600"
  RATE_LIMIT_RPS: "100"
