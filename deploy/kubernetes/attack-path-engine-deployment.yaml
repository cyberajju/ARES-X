apiVersion: apps/v1
kind: Deployment
metadata:
  name: attack-path-engine
  namespace: ares-x
  labels:
    app.kubernetes.io/name: attack-path-engine
    app.kubernetes.io/part-of: ares-x
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: attack-path-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: attack-path-engine
        app.kubernetes.io/part-of: ares-x
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: attack-path-engine
          image: ares-x/attack-path-engine:latest
          ports:
            - name: http
              containerPort: 8082
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ares-x-config
            - secretRef:
                name: ares-x-secrets
          env:
            - name: PORT
              value: "8082"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: attack-path-engine
  namespace: ares-x
  labels:
    app.kubernetes.io/name: attack-path-engine
    app.kubernetes.io/part-of: ares-x
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8082
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: attack-path-engine
