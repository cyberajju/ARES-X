version: "3.9"

services:
  frontend:
    build:
      context: ../
      dockerfile: deploy/docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://api-gateway:8080
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - ares-network
    restart: unless-stopped

  api-gateway:
    build:
      context: ../
      dockerfile: deploy/docker/Dockerfile.api-gateway
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=development
      - PORT=8080
      - GRAPH_ENGINE_ADDR=graph-engine:50051
      - ASSET_SERVICE_ADDR=asset-service:8081
      - ATTACK_PATH_ENGINE_ADDR=attack-path-engine:8082
      - POSTGRES_DSN=postgres://ares:ares_secret@postgres:5432/ares_x?sslmode=disable
      - REDIS_ADDR=redis:6379
      - JWT_SECRET=change-me-in-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ares-network
    restart: unless-stopped

  graph-engine:
    build:
      context: ../
      dockerfile: deploy/docker/Dockerfile.graph-engine
    ports:
      - "50051:50051"
    environment:
      - RUST_LOG=info
      - GRPC_PORT=50051
      - POSTGRES_DSN=postgres://ares:ares_secret@postgres:5432/ares_x?sslmode=disable
      - REDIS_ADDR=redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/grpc-health-probe", "-addr=:50051"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - ares-network
    restart: unless-stopped

  asset-service:
    build:
      context: ../
      dockerfile: deploy/docker/Dockerfile.asset-service
    ports:
      - "8081:8081"
    environment:
      - APP_ENV=development
      - PORT=8081
      - POSTGRES_DSN=postgres://ares:ares_secret@postgres:5432/ares_x?sslmode=disable
      - REDIS_ADDR=redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ares-network
    restart: unless-stopped

  attack-path-engine:
    build:
      context: ../
      dockerfile: deploy/docker/Dockerfile.attack-path-engine
    ports:
      - "8082:8082"
    environment:
      - APP_ENV=development
      - PORT=8082
      - GRAPH_ENGINE_ADDR=graph-engine:50051
      - POSTGRES_DSN=postgres://ares:ares_secret@postgres:5432/ares_x?sslmode=disable
      - REDIS_ADDR=redis:6379
    depends_on:
      graph-engine:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ares-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=ares
      - POSTGRES_PASSWORD=ares_secret
      - POSTGRES_DB=ares_x
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ares -d ares_x"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ares-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ares-network
    restart: unless-stopped

networks:
  ares-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
